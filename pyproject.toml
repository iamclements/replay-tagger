[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replaytagger"
version = "2.2.0"
description = "Tag game clips by genre so Plex builds per-game collections automatically"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "plexapi>=4.15",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
replaytagger = "replaytagger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["replaytagger"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N805"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=replaytagger --cov-report=term-missing -q"
filterwarnings = [
    # pytest-cov leaves its .coverage SQLite file open on Python 3.13; surfaces
    # as ResourceWarning during mock GC cleanup, not from our code
    "ignore:unclosed database:ResourceWarning",
]
