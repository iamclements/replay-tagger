services:
  replaytagger:
    # Use pre-built image from GHCR, or build locally with: make docker-build
    image: ghcr.io/danielclements/replaytagger:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: replaytagger

    volumes:
      # Mount your game clips folder (read-write so ffmpeg can re-mux files)
      - ${CLIPS_DIR:-./clips}:/clips
      # Persist the SQLite state DB and YouTube token between restarts
      - ./data:/app/data
      # Mount your config file (read-only — secrets go in .env)
      - ./config.yaml:/app/config.yaml:ro

    environment:
      # Plex — set these in your .env file, never commit secrets
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_URL=${PLEX_URL:-http://localhost:32400}
      # YouTube privacy override (private | unlisted | public)
      - YOUTUBE_PRIVACY=${YOUTUBE_PRIVACY:-private}
      # Logging — use "text" for human-readable output during dev
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}

    restart: unless-stopped

    # Run once and exit instead of watching (useful for Task Scheduler / cron)
    # profiles: [run-once]
    # command: ["run"]
