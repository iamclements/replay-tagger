services:
  replaytagger:
    image: ghcr.io/iamclements/replay-tagger:latest
    container_name: replaytagger
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PLEX_ENABLED=${PLEX_ENABLED:-false}
      - PLEX_URL=${PLEX_URL:-http://localhost:32400}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_LIBRARY_NAME=${PLEX_LIBRARY_NAME:-Game Clips}
      - PLEX_VERIFY_SSL=${PLEX_VERIFY_SSL:-true}
      - PLEX_AUTO_SCAN=${PLEX_AUTO_SCAN:-true}
      - PLEX_AUTO_COLLECTIONS=${PLEX_AUTO_COLLECTIONS:-true}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY:-}
      - YOUTUBE_ENABLED=${YOUTUBE_ENABLED:-false}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_PRIVACY=${YOUTUBE_PRIVACY:-private}
      - YOUTUBE_AUTO_UPLOAD=${YOUTUBE_AUTO_UPLOAD:-false}
      - YOUTUBE_UPLOAD_AFTER_DAYS=${YOUTUBE_UPLOAD_AFTER_DAYS:-0}
      - DEBOUNCE_SECONDS=${DEBOUNCE_SECONDS:-10}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_TYPE=${WEBHOOK_TYPE:-}
      - WEBHOOK_EVENTS=${WEBHOOK_EVENTS:-scan_complete,error}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - ${CLIPS_DIR:-./clips}:/clips
      - ./data:/app/data
      # Uncomment to use config.yaml (required for game_name_map or multiple webhooks)
      # - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "replaytagger", "--config", "/app/config.yaml", "health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
