<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="ui-sans-serif, system-ui, sans-serif">

  <!-- Background -->
  <rect width="860" height="300" fill="#0d1117" rx="12"/>

  <!-- ── Nodes ── -->

  <!-- NVIDIA Instant Replay -->
  <rect x="20" y="100" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="95" y="126" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">NVIDIA</text>
  <text x="95" y="142" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">Instant Replay</text>

  <!-- Sync Tool -->
  <rect x="230" y="100" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="305" y="126" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">Sync Tool</text>
  <text x="305" y="142" text-anchor="middle" fill="#9ca3af" font-size="11">(e.g. Syncthing)</text>

  <!-- ReplayTagger -->
  <rect x="440" y="100" width="150" height="60" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="515" y="126" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">ReplayTagger</text>
  <text x="515" y="142" text-anchor="middle" fill="#bfdbfe" font-size="11">tags + watches</text>

  <!-- Plex -->
  <rect x="660" y="20" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="735" y="46" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">Plex</text>
  <text x="735" y="62" text-anchor="middle" fill="#9ca3af" font-size="11">game collections</text>

  <!-- YouTube -->
  <rect x="660" y="120" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="735" y="146" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">YouTube</text>
  <text x="735" y="162" text-anchor="middle" fill="#9ca3af" font-size="11">optional archive</text>

  <!-- Notifications -->
  <rect x="660" y="220" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="735" y="246" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">Notifications</text>
  <text x="735" y="262" text-anchor="middle" fill="#9ca3af" font-size="11">Discord / webhook</text>

  <!-- ── Arrows ── -->

  <!-- NVIDIA → Sync -->
  <line x1="170" y1="130" x2="228" y2="130" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sync → ReplayTagger -->
  <line x1="380" y1="130" x2="438" y2="130" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ReplayTagger → Plex -->
  <path d="M590 112 C625 112 635 50 658 50" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ReplayTagger → YouTube -->
  <path d="M590 130 C625 130 635 150 658 150" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>

  <!-- ReplayTagger → Notifications -->
  <path d="M590 148 C625 148 635 250 658 250" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>

  <!-- ── Labels ── -->
  <text x="95" y="178" text-anchor="middle" fill="#6b7280" font-size="10">clips saved per-game</text>
  <text x="305" y="178" text-anchor="middle" fill="#6b7280" font-size="10">delivers to NAS / server</text>
  <text x="619" y="138" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">optional</text>
  <text x="619" y="205" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">optional</text>

  <!-- ── Arrow markers ── -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
  </defs>

</svg>
