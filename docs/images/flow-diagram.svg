<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="ui-sans-serif, system-ui, sans-serif">

  <!-- Background -->
  <rect width="860" height="220" fill="#0d1117" rx="12"/>

  <!-- ── Nodes ── -->

  <!-- NVIDIA Instant Replay -->
  <rect x="20" y="80" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="95" y="106" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">NVIDIA</text>
  <text x="95" y="122" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">Instant Replay</text>

  <!-- Syncthing -->
  <rect x="230" y="80" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="305" y="106" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">Sync Tool</text>
  <text x="305" y="122" text-anchor="middle" fill="#9ca3af" font-size="11">(e.g. Syncthing)</text>

  <!-- ReplayTagger -->
  <rect x="440" y="80" width="150" height="60" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="515" y="106" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">ReplayTagger</text>
  <text x="515" y="122" text-anchor="middle" fill="#bfdbfe" font-size="11">tags + watches</text>

  <!-- Plex -->
  <rect x="660" y="30" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="735" y="56" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">Plex</text>
  <text x="735" y="72" text-anchor="middle" fill="#9ca3af" font-size="11">game collections</text>

  <!-- YouTube -->
  <rect x="660" y="130" width="150" height="60" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <text x="735" y="156" text-anchor="middle" fill="#f9fafb" font-size="12" font-weight="600">YouTube</text>
  <text x="735" y="172" text-anchor="middle" fill="#9ca3af" font-size="11">optional archive</text>

  <!-- ── Arrows ── -->

  <!-- NVIDIA → Sync -->
  <line x1="170" y1="110" x2="228" y2="110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sync → ReplayTagger -->
  <line x1="380" y1="110" x2="438" y2="110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ReplayTagger → Plex -->
  <path d="M590 100 C620 100 630 60 658 60" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ReplayTagger → YouTube -->
  <path d="M590 120 C620 120 630 160 658 160" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>

  <!-- ── Labels ── -->
  <text x="95" y="158" text-anchor="middle" fill="#6b7280" font-size="10">clips saved per-game</text>
  <text x="305" y="158" text-anchor="middle" fill="#6b7280" font-size="10">delivers to NAS / server</text>

  <!-- optional label -->
  <text x="624" y="153" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">optional</text>

  <!-- ── Arrow markers ── -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
  </defs>

</svg>
